<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.classList.add("js")</script>
  <title>Mlink Signage by Mimeda | In-store screens that sell</title>
  <meta name="description" content="Mlink Signage turns every screen in your store into a sales channel, and every idle screen hour into revenue. A Mimeda product.">
  <meta name="theme-color" content="#009FE3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="nav">
  <div class="wrap nav__inner">
    <a href="#top" class="logo" aria-label="Mimeda bonmedia home"><img src="https://mimedacomtrdatastr001.blob.core.windows.net/mimedalayout/mimeda-logo.png" alt="Mimeda" width="1250" height="425" class="logo__img"><span class="logo__product"><img src="assets/img/bonmedia-logo.webp" alt="bonmedia" width="629" height="240" class="logo__brand"></span></a>
    <a href="https://staging.bonmlink.com" class="pill pill--dark pill--sm">Login <i aria-hidden="true">›</i></a>
  </div>
</header>

<main id="top">

  <!-- Hero -->
  <section class="hero">
    <div class="wrap hero__copy">
      <h1 class="hero__title js-split">Show the right thing while your customer is at the shelf.</h1>
      <p class="hero__lead" data-reveal>Mlink Signage turns every screen in your store into a sales channel, and every idle screen hour into revenue.</p>
    </div>

    <div class="hero__stage" aria-label="Sample store: screen content changes through the day">
      <div class="store" data-phase="0">
        <svg class="store__bg" viewBox="0 0 1200 460" preserveAspectRatio="none" aria-hidden="true">
            <!-- duvar ve zemin -->
            <rect width="1200" height="460" class="wall"/>
            <rect y="404" width="1200" height="56" class="floor"/>
            <rect y="400" width="1200" height="6" class="ink"/>
            <!-- tavan lambaları -->
            <g class="ink"><rect x="380" y="0" width="4" height="22"/><rect x="340" y="22" width="84" height="8" rx="2"/>
              <rect x="640" y="0" width="4" height="22"/><rect x="600" y="22" width="84" height="8" rx="2"/></g>
            <!-- giriş kapısı -->
            <rect x="34" y="70" width="190" height="334" class="ink"/>
            <rect x="46" y="82" width="80" height="322" class="sky"/>
            <rect x="132" y="82" width="80" height="322" class="sky"/>
            <rect x="110" y="230" width="8" height="40" rx="3" class="paper"/><rect x="140" y="230" width="8" height="40" rx="3" class="paper"/>
            <rect x="34" y="40" width="190" height="30" class="blue"/>
            <!-- totem ayağı -->
            <rect x="300" y="360" width="16" height="44" class="ink"/><rect x="276" y="396" width="64" height="8" rx="2" class="ink"/>
            <!-- raf ünitesi -->
            <rect x="430" y="96" width="12" height="308" class="ink"/><rect x="778" y="96" width="12" height="308" class="ink"/>
            <g class="ink"><rect x="430" y="168" width="360" height="8"/><rect x="430" y="248" width="360" height="8"/><rect x="430" y="328" width="360" height="8"/><rect x="430" y="396" width="360" height="8"/></g>
            <g class="p1"><rect x="452" y="120" width="34" height="48"/><rect x="560" y="132" width="44" height="36"/><rect x="690" y="116" width="30" height="52"/><rect x="452" y="282" width="52" height="46"/><rect x="620" y="276" width="34" height="52"/><rect x="474" y="350" width="70" height="46"/><rect x="700" y="356" width="60" height="40"/></g>
            <g class="p2"><rect x="492" y="128" width="30" height="40"/><rect x="612" y="124" width="36" height="44"/><rect x="730" y="130" width="40" height="38"/><rect x="512" y="292" width="40" height="36"/><rect x="664" y="290" width="44" height="38"/><rect x="560" y="358" width="56" height="38"/></g>
            <g class="p3"><rect x="530" y="118" width="24" height="50"/><rect x="654" y="136" width="28" height="32"/><rect x="560" y="284" width="50" height="44"/><rect x="718" y="282" width="46" height="46"/><rect x="626" y="346" width="64" height="50"/></g>
            <!-- duvar saati -->
            <circle cx="900" cy="78" r="34" class="paper"/><circle cx="900" cy="78" r="34" class="ring"/>
            <!-- kasa ekranı askısı -->
            <g class="ink"><rect x="944" y="0" width="3" height="104"/><rect x="1118" y="0" width="3" height="104"/></g>
            <!-- kasa bankosu -->
            <rect x="900" y="300" width="270" height="104" class="ink"/>
            <rect x="900" y="292" width="270" height="12" class="blue"/>
            <rect x="944" y="250" width="58" height="42" rx="4" class="paper"/><rect x="964" y="276" width="18" height="16" class="ink"/>
          </svg>
        <div class="clock" aria-hidden="true"><span class="js-time">08:30</span></div>
        <div class="screen screen--totem" aria-hidden="true"><div class="screen__in js-totem"></div></div>
        <div class="screen screen--shelf" aria-hidden="true"><div class="screen__in js-shelf"></div></div>
        <div class="screen screen--till" aria-hidden="true">
          <div class="screen__in js-till"></div>
          <span class="sold">This hour is sold to a brand</span>
        </div>
      </div>
      <div class="wrap hero__controls">
        <div class="phases" role="group" aria-label="Time of day in the sample store">
          <button type="button" aria-pressed="true" data-go="0">Morning</button>
          <button type="button" aria-pressed="false" data-go="1">Noon</button>
          <button type="button" aria-pressed="false" data-go="2">Evening</button>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="wrap footer__inner">
    <span class="logo logo--light"><img src="https://mimedacomtrdatastr001.blob.core.windows.net/mimedalayout/mimeda-logo.png" alt="Mimeda" width="1250" height="425" class="logo__img"><span class="logo__product"><img src="assets/img/bonmedia-logo.webp" alt="bonmedia" width="629" height="240" class="logo__brand"></span></span>
    <p>A <a href="https://mimeda.com.tr" target="_blank" rel="noopener">Mimeda</a> product</p>
    <p class="footer__copy">© <span class="js-year">2026</span> Mimeda</p>
  </div>
</footer>

<script src="assets/js/main.js" defer></script>
</body>
</html>
